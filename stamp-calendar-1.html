<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출석 캘린더</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #f7f6f3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.07);
  }

  .page-title {
    font-size: 22px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: -0.5px;
    margin-bottom: 20px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .nav-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #aaa;
    font-size: 18px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color 0.15s;
  }
  .nav-btn:hover { color: #333; }

  .month-title {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: -0.5px;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 8px;
  }

  .weekday {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: #bbb;
    padding: 4px 0;
    letter-spacing: 0.5px;
  }

  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    transition: background 0.1s;
  }

  .day:not(.empty):not(.future):hover {
    background: #f5f5f5;
  }

  .day-num {
    font-size: 13px;
    color: #555;
    font-weight: 500;
    z-index: 1;
    transition: opacity 0.15s;
  }

  .day.today .day-num {
    color: #e05a2b;
    font-weight: 700;
  }

  .day.future .day-num {
    color: #ddd;
    cursor: default;
  }

  .day.empty { cursor: default; }

  /* 도장 */
  .stamp {
    position: absolute;
    inset: 3px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    transform: scale(0.7) rotate(-8deg);
    pointer-events: none;
  }

  .day.stamped .stamp {
    opacity: 1;
    transform: scale(1) rotate(-8deg);
  }

  .stamp-inner {
    width: 100%;
    height: 100%;
    border: 2px solid #e05a2b;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }

  .stamp-text {
    font-size: 7px;
    font-weight: 800;
    color: #e05a2b;
    letter-spacing: -0.3px;
    text-align: center;
    line-height: 1.3;
    white-space: pre;
  }

  .day.stamped .day-num {
    opacity: 0;
  }

  /* 오늘 테두리 */
  .day.today:not(.stamped) .day-num {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #fff3ee;
  }

  .footer {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .streak {
    font-size: 13px;
    color: #aaa;
  }
  .streak span {
    color: #e05a2b;
    font-weight: 700;
  }

  .stamp-btn {
    background: #e05a2b;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: -0.3px;
  }
  .stamp-btn:hover { background: #c94e22; }
  .stamp-btn:active { transform: scale(0.96); }
  .stamp-btn:disabled {
    background: #eee;
    color: #bbb;
    cursor: default;
  }
</style>
</head>
<body>

<div class="card">
  <div class="page-title">쇼츠 업로드</div>
  <div class="header">
    <button class="nav-btn" id="prevBtn">&#8249;</button>
    <div class="month-title" id="monthTitle"></div>
    <button class="nav-btn" id="nextBtn">&#8250;</button>
  </div>

  <div class="weekdays">
    <div class="weekday">일</div>
    <div class="weekday">월</div>
    <div class="weekday">화</div>
    <div class="weekday">수</div>
    <div class="weekday">목</div>
    <div class="weekday">금</div>
    <div class="weekday">토</div>
  </div>

  <div class="days" id="daysGrid"></div>

  <div class="footer">
    <div class="streak">연속 <span id="streakCount">0</span>일째</div>
    <button class="stamp-btn" id="stampBtn">오늘 도장 찍기</button>
  </div>
</div>

<script>
  const today = new Date();
  today.setHours(0,0,0,0);

  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();

  // 도장 찍힌 날짜 저장 (YYYY-MM-DD)
  const stamped = new Set(JSON.parse(localStorage.getItem('stamped') || '[]'));

  function dateKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function todayKey() {
    return dateKey(today.getFullYear(), today.getMonth(), today.getDate());
  }

  function render() {
    const title = document.getElementById('monthTitle');
    title.textContent = `${viewYear}년 ${viewMonth + 1}월`;

    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

    // 빈칸
    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'day empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= lastDate; d++) {
      const key = dateKey(viewYear, viewMonth, d);
      const date = new Date(viewYear, viewMonth, d);
      const isToday = date.getTime() === today.getTime();
      const isFuture = date > today;
      const isStamped = stamped.has(key);

      const el = document.createElement('div');
      el.className = 'day' +
        (isToday ? ' today' : '') +
        (isFuture ? ' future' : '') +
        (isStamped ? ' stamped' : '');

      el.innerHTML = `
        <div class="day-num">${d}</div>
        <div class="stamp">
          <div class="stamp-inner">
            <div class="stamp-text">업로드\n완료</div>
          </div>
        </div>
      `;

      if (!isFuture && !isStamped) {
        el.addEventListener('click', () => toggleStamp(key, el));
      }

      grid.appendChild(el);
    }

    updateBtn();
    updateStreak();
  }

  function toggleStamp(key, el) {
    if (stamped.has(key)) {
      stamped.delete(key);
      el.classList.remove('stamped');
    } else {
      stamped.add(key);
      el.classList.add('stamped');
    }
    save();
    updateBtn();
    updateStreak();
  }

  function save() {
    localStorage.setItem('stamped', JSON.stringify([...stamped]));
  }

  function updateBtn() {
    const btn = document.getElementById('stampBtn');
    const isCurrentMonth = viewYear === today.getFullYear() && viewMonth === today.getMonth();
    if (!isCurrentMonth) {
      btn.disabled = true;
      btn.textContent = '오늘 도장 찍기';
      return;
    }
    const done = stamped.has(todayKey());
    btn.disabled = done;
    btn.textContent = done ? '오늘 완료 ✓' : '오늘 도장 찍기';
  }

  function updateStreak() {
    let streak = 0;
    let cur = new Date(today);
    while (true) {
      const k = dateKey(cur.getFullYear(), cur.getMonth(), cur.getDate());
      if (stamped.has(k)) {
        streak++;
        cur.setDate(cur.getDate() - 1);
      } else break;
    }
    document.getElementById('streakCount').textContent = streak;
  }

  document.getElementById('stampBtn').addEventListener('click', () => {
    const key = todayKey();
    if (!stamped.has(key)) {
      stamped.add(key);
      save();
      render();
    }
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  });

  render();
</script>
</body>
</html>
