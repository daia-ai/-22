<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도장 캘린더</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #f7f6f3;
    min-height: 100vh;
    padding: 0;
  }

  /* ── 공통 페이지 ── */
  .page {
    display: none;
    min-height: 100vh;
    padding: 48px 24px 40px;
    max-width: 400px;
    margin: 0 auto;
  }
  .page.active { display: block; }

  /* ── 목록 페이지 ── */
  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .list-header h1 {
    font-size: 24px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: -0.5px;
  }
  .add-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #e05a2b;
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: background 0.15s, transform 0.1s;
  }
  .add-btn:active { transform: scale(0.93); }

  .goal-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .goal-card {
    background: #fff;
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    gap: 12px;
  }
  .goal-card:active { transform: scale(0.98); }

  .goal-info { flex: 1; min-width: 0; }
  .goal-name {
    font-size: 16px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: -0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .goal-meta {
    font-size: 12px;
    color: #bbb;
    margin-top: 4px;
  }
  .goal-meta span { color: #e05a2b; font-weight: 700; }

  .goal-stamp-preview {
    font-size: 10px;
    font-weight: 800;
    color: #e05a2b;
    border: 2px solid #e05a2b;
    border-radius: 6px;
    padding: 4px 6px;
    text-align: center;
    line-height: 1.3;
    white-space: pre;
    flex-shrink: 0;
    opacity: 0.7;
    transform: rotate(-8deg);
  }

  .goal-delete {
    background: none;
    border: none;
    color: #ddd;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .goal-delete:hover { color: #e05a2b; }

  .empty-state {
    text-align: center;
    color: #ccc;
    font-size: 14px;
    margin-top: 80px;
    line-height: 2;
  }

  /* ── 캘린더 페이지 ── */
  .cal-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .back-btn {
    background: none;
    border: none;
    font-size: 22px;
    color: #aaa;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
  .cal-title-row {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .cal-title {
    font-size: 20px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: -0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-edit-btn {
    background: none;
    border: none;
    font-size: 15px;
    color: #ccc;
    cursor: pointer;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .cal-edit-btn:hover { color: #e05a2b; }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.07);
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .nav-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #aaa;
    font-size: 18px;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .month-title {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }
  .weekday {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: #bbb;
    padding: 4px 0;
  }

  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }

  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    transition: background 0.1s;
  }
  .day:not(.empty):not(.future):hover { background: #f5f5f5; }
  .day-num {
    font-size: 12px;
    color: #555;
    font-weight: 500;
    z-index: 1;
    transition: opacity 0.15s;
  }
  .day.today .day-num { color: #e05a2b; font-weight: 700; }
  .day.future .day-num { color: #ddd; cursor: default; }
  .day.empty { cursor: default; }

  .stamp {
    position: absolute;
    inset: 2px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    transform: scale(0.7) rotate(-8deg);
    pointer-events: none;
  }
  .day.stamped .stamp {
    opacity: 1;
    transform: scale(1) rotate(-8deg);
  }
  .stamp-inner {
    width: 100%;
    height: 100%;
    border: 2px solid #e05a2b;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stamp-text {
    font-size: 6.5px;
    font-weight: 800;
    color: #e05a2b;
    text-align: center;
    line-height: 1.3;
    white-space: pre;
  }
  .day.stamped .day-num { opacity: 0; }
  .day.today:not(.stamped) .day-num {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: #fff3ee;
  }

  .footer {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .streak { font-size: 13px; color: #aaa; }
  .streak span { color: #e05a2b; font-weight: 700; }
  .stamp-btn {
    background: #e05a2b;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, transform 0.1s;
  }
  .stamp-btn:active { transform: scale(0.96); }
  .stamp-btn:disabled { background: #eee; color: #bbb; cursor: default; }

  /* ── 모달 ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 28px 24px 48px;
    width: 100%;
    max-width: 400px;
  }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: #1a1a1a; }
  .modal p { font-size: 12px; color: #bbb; margin-bottom: 16px; }
  .modal label { font-size: 12px; font-weight: 600; color: #aaa; display: block; margin-bottom: 6px; margin-top: 14px; }
  .modal input[type="text"] {
    width: 100%;
    border: 1.5px solid #eee;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .modal input:focus { border-color: #e05a2b; }
  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
  .modal-cancel {
    flex: 1; padding: 12px; border: 1.5px solid #eee; border-radius: 10px;
    background: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; color: #aaa;
  }
  .modal-save {
    flex: 2; padding: 12px; border: none; border-radius: 10px;
    background: #e05a2b; color: #fff; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>

<!-- 목록 페이지 -->
<div class="page active" id="listPage">
  <div class="list-header">
    <h1>내 목표</h1>
    <button class="add-btn" id="addGoalBtn">+</button>
  </div>
  <div class="goal-list" id="goalList"></div>
</div>

<!-- 캘린더 페이지 -->
<div class="page" id="calPage">
  <div class="cal-header">
    <button class="back-btn" id="backBtn">‹</button>
    <div class="cal-title-row">
      <div class="cal-title" id="calTitle"></div>
      <button class="cal-edit-btn" id="calEditBtn">✏️</button>
    </div>
  </div>

  <div class="card">
    <div class="month-nav">
      <button class="nav-btn" id="prevBtn">&#8249;</button>
      <div class="month-title" id="monthTitle"></div>
      <button class="nav-btn" id="nextBtn">&#8250;</button>
    </div>
    <div class="weekdays">
      <div class="weekday">일</div><div class="weekday">월</div>
      <div class="weekday">화</div><div class="weekday">수</div>
      <div class="weekday">목</div><div class="weekday">금</div>
      <div class="weekday">토</div>
    </div>
    <div class="days" id="daysGrid"></div>
    <div class="footer">
      <div class="streak">연속 <span id="streakCount">0</span>일째</div>
      <button class="stamp-btn" id="stampBtn">오늘 도장 찍기</button>
    </div>
  </div>
</div>

<!-- 목표 추가/수정 모달 -->
<div class="modal-overlay" id="goalModal">
  <div class="modal">
    <h3 id="modalTitle">새 목표</h3>
    <p>제목이랑 도장 문구를 입력하세요</p>
    <label>목표 이름</label>
    <input type="text" id="inputName" placeholder="쇼츠 업로드" maxlength="20">
    <label>도장 문구 (엔터로 줄바꿈)</label>
    <textarea id="inputStamp" placeholder="업로드&#10;완료" rows="2" style="width:100%;border:1.5px solid #eee;border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none;resize:none;line-height:1.5;"></textarea>
    <div class="modal-btns">
      <button class="modal-cancel" id="modalCancel">취소</button>
      <button class="modal-save" id="modalSave">저장</button>
    </div>
  </div>
</div>

<script>
  const today = new Date();
  today.setHours(0,0,0,0);

  // ── 데이터 ──
  let goals = JSON.parse(localStorage.getItem('goals') || '[]');
  // goals = [{ id, name, stampText, stamped: [] }, ...]

  let currentGoalId = null;
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let editingGoalId = null; // 모달 편집 대상

  function saveGoals() {
    localStorage.setItem('goals', JSON.stringify(goals));
  }

  function getGoal(id) {
    return goals.find(g => g.id === id);
  }

  function dateKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  function todayKey() {
    return dateKey(today.getFullYear(), today.getMonth(), today.getDate());
  }

  // ── 목록 렌더 ──
  function renderList() {
    const list = document.getElementById('goalList');
    list.innerHTML = '';
    if (goals.length === 0) {
      list.innerHTML = '<div class="empty-state">아직 목표가 없어요<br>+ 버튼으로 추가해보세요</div>';
      return;
    }
    goals.forEach(g => {
      const div = document.createElement('div');
      div.className = 'goal-card';
      div.innerHTML = `
        <div class="goal-info">
          <div class="goal-name">${g.name}</div>
        </div>
        <div class="goal-stamp-preview">${g.stampText}</div>
        <button class="goal-delete" data-id="${g.id}">×</button>
      `;
      div.addEventListener('click', (e) => {
        if (e.target.classList.contains('goal-delete')) return;
        openCalendar(g.id);
      });
      div.querySelector('.goal-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm(`"${g.name}" 목표를 삭제할까요?`)) {
          goals = goals.filter(x => x.id !== g.id);
          saveGoals();
          renderList();
        }
      });
      list.appendChild(div);
    });
  }

  function calcStreak(g) {
    let streak = 0;
    let cur = new Date(today);
    const set = new Set(g.stamped);
    while (true) {
      const k = dateKey(cur.getFullYear(), cur.getMonth(), cur.getDate());
      if (set.has(k)) { streak++; cur.setDate(cur.getDate() - 1); }
      else break;
    }
    return streak;
  }

  // ── 캘린더 ──
  function openCalendar(id) {
    currentGoalId = id;
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    const g = getGoal(id);
    document.getElementById('calTitle').textContent = g.name;
    document.getElementById('listPage').classList.remove('active');
    document.getElementById('calPage').classList.add('active');
    renderCal();
  }

  function renderCal() {
    const g = getGoal(currentGoalId);
    const stamped = new Set(g.stamped);
    document.getElementById('monthTitle').textContent = `${viewYear}년 ${viewMonth + 1}월`;
    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'day empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= lastDate; d++) {
      const key = dateKey(viewYear, viewMonth, d);
      const date = new Date(viewYear, viewMonth, d);
      const isToday = date.getTime() === today.getTime();
      const isFuture = date > today;
      const isStamped = stamped.has(key);

      const el = document.createElement('div');
      el.className = 'day' +
        (isToday ? ' today' : '') +
        (isFuture ? ' future' : '') +
        (isStamped ? ' stamped' : '');

      el.innerHTML = `
        <div class="day-num">${d}</div>
        <div class="stamp"><div class="stamp-inner"><div class="stamp-text">${g.stampText}</div></div></div>
      `;

      if (!isFuture) {
        el.addEventListener('click', () => toggleStamp(key, el));
      }
      grid.appendChild(el);
    }

    updateBtn();
    updateStreak();
  }

  function toggleStamp(key, el) {
    const g = getGoal(currentGoalId);
    const set = new Set(g.stamped);
    if (set.has(key)) { set.delete(key); el.classList.remove('stamped'); }
    else { set.add(key); el.classList.add('stamped'); }
    g.stamped = [...set];
    saveGoals();
    updateBtn();
    updateStreak();
  }

  function updateBtn() {
    const btn = document.getElementById('stampBtn');
    const isCurrentMonth = viewYear === today.getFullYear() && viewMonth === today.getMonth();
    const g = getGoal(currentGoalId);
    const done = new Set(g.stamped).has(todayKey());
    btn.disabled = done || !isCurrentMonth;
    btn.textContent = done ? '오늘 완료 ✓' : '오늘 도장 찍기';
  }

  function updateStreak() {
    const g = getGoal(currentGoalId);
    document.getElementById('streakCount').textContent = calcStreak(g);
  }

  document.getElementById('stampBtn').addEventListener('click', () => {
    const key = todayKey();
    const g = getGoal(currentGoalId);
    const set = new Set(g.stamped);
    if (!set.has(key)) {
      set.add(key);
      g.stamped = [...set];
      saveGoals();
      renderCal();
    }
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } renderCal();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } renderCal();
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('calPage').classList.remove('active');
    document.getElementById('listPage').classList.add('active');
    renderList();
  });

  // ── 모달 ──
  function openModal(goalId = null) {
    editingGoalId = goalId;
    const modal = document.getElementById('goalModal');
    const g = goalId ? getGoal(goalId) : null;
    document.getElementById('modalTitle').textContent = goalId ? '목표 수정' : '새 목표';
    document.getElementById('inputName').value = g ? g.name : '';
    document.getElementById('inputStamp').value = g ? g.stampText.replace(/\\n/g, '\n') : '';
    modal.classList.add('open');
  }

  document.getElementById('addGoalBtn').addEventListener('click', () => openModal());
  document.getElementById('calEditBtn').addEventListener('click', () => openModal(currentGoalId));

  document.getElementById('modalCancel').addEventListener('click', () => {
    document.getElementById('goalModal').classList.remove('open');
  });
  document.getElementById('goalModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('goalModal'))
      document.getElementById('goalModal').classList.remove('open');
  });

  document.getElementById('modalSave').addEventListener('click', () => {
    const name = document.getElementById('inputName').value.trim();
    const stampText = document.getElementById('inputStamp').value.trim().replace(/\n/g, '\n');
    if (!name) return;
    const text = stampText || '완료';

    if (editingGoalId) {
      const g = getGoal(editingGoalId);
      g.name = name;
      g.stampText = text;
      document.getElementById('calTitle').textContent = name;
    } else {
      goals.push({ id: Date.now().toString(), name, stampText: text, stamped: [] });
    }
    saveGoals();
    document.getElementById('goalModal').classList.remove('open');
    if (editingGoalId) renderCal();
    else renderList();
  });

  // ── 초기화 ──
  renderList();
</script>
</body>
</html>
